# ═══════════════════════════════════════════════════
# TruckHire - PROD Profile Configuration
# ═══════════════════════════════════════════════════
# This file ONLY loads when spring.profiles.active=prod
#
# PROD environment:
#   - All secrets via environment variables
#   - SQL logging OFF
#   - Flyway clean DISABLED
#   - Swagger UI disabled (security)
# ═══════════════════════════════════════════════════

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 10

  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate

  flyway:
    clean-disabled: true   # NEVER allow clean in production

# Disable Swagger in production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# Logging: WARN and above only
logging:
  level:
    root: WARN
    com.truckhire: INFO

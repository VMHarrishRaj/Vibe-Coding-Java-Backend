# ═══════════════════════════════════════════════════
# TruckRental - DEV Profile Configuration
# ═══════════════════════════════════════════════════
# This file ONLY loads when spring.profiles.active=dev
# It overrides values from application.yml
#
# DEV environment:
#   - PostgreSQL on localhost
#   - Redis on localhost
#   - SQL logging enabled
#   - Swagger UI enabled
# ═══════════════════════════════════════════════════

spring:
  # ── PostgreSQL Connection ──
  # Set DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD in .env before running.
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    # HikariCP connection pool (Spring Boot default)
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  # ── Redis Connection ──
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      # password: ${REDIS_PASSWORD:}  # uncomment if Redis requires auth

  # ── JPA Dev Overrides ──
  jpa:
    show-sql: true
    hibernate:
      # In dev, let Hibernate validate the schema against entities
      # Flyway creates the tables, Hibernate just checks they match
      ddl-auto: validate

  # ── Flyway Dev ──
  flyway:
    clean-disabled: false   # Allow clean in dev (NEVER in prod)

# ── Logging ──
logging:
  level:
    com.truckhire: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
